<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RECT BLASTER</title>
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.92);
      --line: #38bdf8;
      --line-soft: rgba(56, 189, 248, 0.35);
      --text: #e0f2fe;
      --muted: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 34%),
        linear-gradient(180deg, #020617 0%, #020617 55%, #030712 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: min(100vw, 480px);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .title {
      margin: 2px 0 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1;
      letter-spacing: 0.14em;
      text-align: center;
      color: #f0f9ff;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .hud {
      width: min(100%, 360px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud-card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 7px 8px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.11);
      text-align: center;
    }

    .hud-label {
      display: block;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .hud-value {
      display: block;
      margin-top: 2px;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .game-wrap {
      position: relative;
      width: min(100%, 360px);
      aspect-ratio: 10 / 20;
      border: 2px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(rgba(56, 189, 248, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.07) 1px, transparent 1px),
        rgba(2, 6, 23, 0.86);
      background-size: 10% 5%;
      box-shadow:
        0 0 0 1px rgba(14, 165, 233, 0.2) inset,
        0 0 36px rgba(14, 165, 233, 0.25);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
      z-index: 5;
    }

    .overlay.show {
      display: flex;
    }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.9);
    }

    .overlay p {
      margin: 4px 0;
      color: var(--text);
      line-height: 1.55;
    }

    .controls {
      width: min(100%, 360px);
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 10px;
      user-select: none;
    }

    button {
      border: 1px solid #38bdf8;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(7, 89, 133, 0.58));
      color: #f0f9ff;
      border-radius: 16px;
      padding: 12px 10px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.18);
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
      background: #075985;
    }

    .small-actions {
      width: min(100%, 360px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .small-actions button {
      padding: 9px 10px;
      font-size: 13px;
      border-radius: 12px;
    }

    .help {
      width: min(100%, 360px);
      margin: 0;
      color: rgba(224, 242, 254, 0.76);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .flash {
      animation: flash 160ms ease-out;
    }

    @keyframes flash {
      0% { filter: brightness(2); }
      100% { filter: brightness(1); }
    }

    @media (min-height: 760px) {
      .app {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title">RECT BLASTER</h1>
    <p class="subtitle">QUARTH-LIKE TUNED v6</p>

    <section class="hud" aria-label="スコア表示">
      <div class="hud-card">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">LEVEL</span>
        <span class="hud-value" id="level">1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">BEST</span>
        <span class="hud-value" id="best">0</span>
      </div>
    </section>

    <section class="game-wrap" id="gameWrap">
      <canvas id="game" width="300" height="600" aria-label="RECT BLASTER game field"></canvas>

      <div class="overlay show" id="startOverlay">
        <h2>READY?</h2>
        <p>v6ではゲームオーバー判定を修正。<br>より見極め型のブロック構成に寄せています。</p>
        <button id="startBtn">START</button>
      </div>

      <div class="overlay" id="gameOverOverlay">
        <h2>GAME OVER</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Best: <span id="finalBest">0</span></p>
        <button id="retryBtn">RETRY</button>
      </div>

      <div class="overlay" id="pauseOverlay">
        <h2>PAUSE</h2>
        <p>Pキー、または一時停止ボタンで再開</p>
      </div>
    </section>

    <section class="controls" aria-label="スマホ操作">
      <button id="leftBtn">←</button>
      <button id="shootBtn">SHOT</button>
      <button id="rightBtn">→</button>
    </section>

    <section class="small-actions">
      <button id="pauseBtn">PAUSE</button>
      <button id="soundBtn">SOUND ON</button>
    </section>

    <p class="help">
      PC: ← → で移動 / Spaceで発射 / Pで一時停止 / Rでリスタート<br>
      危険ラインに到達したら終了。複数箇所を埋めて四角形を完成させてください。
    </p>
  </main>

  <script>
    "use strict";

    const COLS = 10;
    const ROWS = 20;
    const CELL = 30;
    const CANVAS_W = COLS * CELL;
    const CANVAS_H = ROWS * CELL;

    const EMPTY = 0;

    const INITIAL_DROP_INTERVAL = 1650;
    const MIN_DROP_INTERVAL = 780;
    const BULLET_INTERVAL = 50;
    const SPAWN_INTERVAL_BASE = 2750;
    const BEST_KEY = "rect_blaster_best_score_v6";
    const DANGER_ROW = ROWS - 1;

    /*
      v6の方針：
      QUARTH風に近づけるため、1〜2発で消えすぎる親切設計をやめる。
      ただし上からしか埋められない理不尽形は出さない。
      ゲームオーバーは危険ライン到達時のみ。

      v5の方針：
      groupId方式は維持。
      レベルアップでは落下速度よりも「必要ショット数」と「同時出現数」で難易度を上げる。

      v4の根本修正：
      gridには 0 または groupId を入れる。
      これにより、別々に落ちてきたブロックが隣接しても同じ塊として扱わない。
      弾は、衝突したブロックのgroupIdに追加される。
      四角形判定も、そのgroupIdだけで行う。
    */

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;

    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const bestEl = document.getElementById("best");
    const finalScoreEl = document.getElementById("finalScore");
    const finalBestEl = document.getElementById("finalBest");
    const startOverlay = document.getElementById("startOverlay");
    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const gameWrap = document.getElementById("gameWrap");

    let grid;
    let player;
    let bullets;
    let score;
    let level;
    let bestScore;
    let running;
    let paused;
    let gameEnded;
    let nextGroupId;

    let lastTime = 0;
    let dropTimer = 0;
    let spawnTimer = 0;
    let bulletTimer = 0;
    let clearFlashTimer = 0;

    let keys = { left: false, right: false };
    let soundEnabled = true;
    let audioCtx = null;

    function initGame() {
      bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = bestScore;
      resetGame(false);
      bindEvents();
      requestAnimationFrame(gameLoop);
    }

    function resetGame(startNow = true) {
      grid = createEmptyGrid();
      player = { x: Math.floor(COLS / 2), y: ROWS - 1 };
      bullets = [];
      score = 0;
      level = 1;
      nextGroupId = 1;
      running = startNow;
      paused = false;
      gameEnded = false;
      lastTime = 0;
      dropTimer = 0;
      spawnTimer = startNow ? 2200 : 0;
      bulletTimer = 0;
      clearFlashTimer = 0;

      scoreEl.textContent = score;
      levelEl.textContent = level;
      bestEl.textContent = bestScore;

      startOverlay.classList.toggle("show", !startNow);
      gameOverOverlay.classList.remove("show");
      pauseOverlay.classList.remove("show");

      draw();

      if (startNow) {
        setTimeout(() => {
          if (running && !gameEnded) spawnBlock(true);
        }, 500);
      }
    }

    function createEmptyGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
    }

    function bindEvents() {
      document.addEventListener("keydown", (e) => {
        if (e.code === "ArrowLeft") {
          keys.left = true;
          e.preventDefault();
        }
        if (e.code === "ArrowRight") {
          keys.right = true;
          e.preventDefault();
        }
        if (e.code === "Space") {
          shoot();
          e.preventDefault();
        }
        if (e.code === "KeyP") {
          togglePause();
          e.preventDefault();
        }
        if (e.code === "KeyR") {
          resetGame(true);
          e.preventDefault();
        }
      });

      document.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft") keys.left = false;
        if (e.code === "ArrowRight") keys.right = false;
      });

      document.getElementById("startBtn").addEventListener("click", () => resetGame(true));
      document.getElementById("retryBtn").addEventListener("click", () => resetGame(true));
      document.getElementById("pauseBtn").addEventListener("click", togglePause);
      document.getElementById("soundBtn").addEventListener("click", toggleSound);

      bindHoldButton("leftBtn", () => movePlayer(-1));
      bindHoldButton("rightBtn", () => movePlayer(1));

      document.getElementById("shootBtn").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        shoot();
      });
    }

    function bindHoldButton(id, action) {
      const btn = document.getElementById(id);
      let intervalId = null;

      const start = (e) => {
        e.preventDefault();
        action();
        clearInterval(intervalId);
        intervalId = setInterval(action, 110);
      };
      const stop = () => {
        clearInterval(intervalId);
        intervalId = null;
      };

      btn.addEventListener("pointerdown", start);
      btn.addEventListener("pointerup", stop);
      btn.addEventListener("pointercancel", stop);
      btn.addEventListener("pointerleave", stop);
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      if (running && !paused && !gameEnded) {
        update(delta);
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function update(delta) {
      bulletTimer += delta;
      dropTimer += delta;
      spawnTimer += delta;
      if (clearFlashTimer > 0) clearFlashTimer -= delta;

      handleContinuousInput(delta);

      while (bulletTimer >= BULLET_INTERVAL) {
        updateBullets();
        bulletTimer -= BULLET_INTERVAL;
      }

      const dropInterval = Math.max(MIN_DROP_INTERVAL, INITIAL_DROP_INTERVAL - (level - 1) * 32);
      if (dropTimer >= dropInterval) {
        moveBlocksDownAsWhole();
        dropTimer = 0;
      }

      const spawnInterval = Math.max(1350, SPAWN_INTERVAL_BASE - (level - 1) * 85);
      if (spawnTimer >= spawnInterval) {
        spawnBlock(false);
        spawnTimer = 0;
      }

      checkLevelUp();
      checkGameOver();
    }

    let moveAccumulator = 0;
    function handleContinuousInput(delta) {
      moveAccumulator += delta;
      if (moveAccumulator < 90) return;

      if (keys.left) {
        movePlayer(-1);
        moveAccumulator = 0;
      } else if (keys.right) {
        movePlayer(1);
        moveAccumulator = 0;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      drawBackground();
      drawGridBlocks();
      drawBullets();
      drawPlayer();

      if (clearFlashTimer > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.12)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.strokeStyle = "rgba(56, 189, 248, 0.14)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, CANVAS_H);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(CANVAS_W, y * CELL);
        ctx.stroke();
      }

      ctx.strokeStyle = "rgba(251, 113, 133, 0.45)";
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(0, DANGER_ROW * CELL);
      ctx.lineTo(CANVAS_W, DANGER_ROW * CELL);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawGridBlocks() {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const id = grid[y][x];
          if (id !== EMPTY) {
            const hueShift = id % 5;
            const fills = [
              ["#22d3ee", "#0ea5e9"],
              ["#67e8f9", "#0891b2"],
              ["#7dd3fc", "#0284c7"],
              ["#38bdf8", "#0369a1"],
              ["#a5f3fc", "#0891b2"]
            ];
            drawBlock(x, y, fills[hueShift][0], fills[hueShift][1]);
          }
        }
      }
    }

    function drawBlock(x, y, fill, inner) {
      const px = x * CELL;
      const py = y * CELL;
      const pad = 3;

      ctx.shadowBlur = 12;
      ctx.shadowColor = "rgba(34, 211, 238, 0.75)";
      ctx.fillStyle = fill;
      ctx.fillRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2);

      ctx.shadowBlur = 0;
      ctx.fillStyle = inner;
      ctx.fillRect(px + pad + 4, py + pad + 4, CELL - (pad + 4) * 2, CELL - (pad + 4) * 2);

      ctx.strokeStyle = "rgba(240, 249, 255, 0.7)";
      ctx.lineWidth = 1;
      ctx.strokeRect(px + pad + 0.5, py + pad + 0.5, CELL - pad * 2 - 1, CELL - pad * 2 - 1);
    }

    function drawBullets() {
      for (const bullet of bullets) {
        drawBlock(bullet.x, bullet.y, "#f8fafc", "#bae6fd");
      }
    }

    function drawPlayer() {
      const x = player.x * CELL;
      const y = player.y * CELL;

      ctx.shadowBlur = 16;
      ctx.shadowColor = "rgba(125, 211, 252, 0.95)";
      ctx.fillStyle = "#f0f9ff";
      ctx.beginPath();
      ctx.moveTo(x + CELL / 2, y + 4);
      ctx.lineTo(x + CELL - 5, y + CELL - 5);
      ctx.lineTo(x + 5, y + CELL - 5);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function spawnBlock(isOpeningPractice) {
      if (countActiveGroups() >= maxGroupsForLevel()) return;

      const shape = generateBottomGapShape(isOpeningPractice);
      const width = shape[0].length;

      let startX = isOpeningPractice
        ? Math.floor((COLS - width) / 2)
        : Math.floor(Math.random() * (COLS - width + 1));

      const possibleXs = [];
      for (let x = 0; x <= COLS - width; x++) {
        if (canPlaceShape(shape, x, 0)) possibleXs.push(x);
      }

      if (possibleXs.length === 0) {
        triggerGameOver();
        return;
      }

      if (!canPlaceShape(shape, startX, 0)) {
        startX = possibleXs[Math.floor(Math.random() * possibleXs.length)];
      }

      placeShape(shape, startX, 0, nextGroupId++);
    }

    function maxGroupsForLevel() {
      if (level <= 2) return 4;
      if (level <= 5) return 5;
      if (level <= 9) return 6;
      if (level <= 15) return 7;
      return 8;
    }

    function countActiveGroups() {
      const ids = new Set();
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x] !== EMPTY) ids.add(grid[y][x]);
        }
      }
      return ids.size;
    }

    function generateBottomGapShape(isOpeningPractice) {
      /*
        v6：
        1〜2発で消えすぎる状態を調整。
        完成予定の長方形から、下から到達できるマスだけを欠けさせる。
        欠けは最下段中心だが、中段も「その下が空いている列」に限って欠けさせる。
        これにより、下から複数発を撃ち込めば完成可能。
      */
      let patterns;

      if (isOpeningPractice || level <= 2) {
        patterns = [
          { w: 3, h: 2, holes: 2, upper: 0 },
          { w: 4, h: 2, holes: 2, upper: 0 },
          { w: 4, h: 3, holes: 2, upper: 0 },
          { w: 5, h: 2, holes: 2, upper: 0 }
        ];
      } else if (level <= 5) {
        patterns = [
          { w: 4, h: 2, holes: 2, upper: 0 },
          { w: 4, h: 3, holes: 3, upper: 0 },
          { w: 5, h: 2, holes: 3, upper: 0 },
          { w: 5, h: 3, holes: 3, upper: 1 },
          { w: 6, h: 2, holes: 3, upper: 0 }
        ];
      } else if (level <= 10) {
        patterns = [
          { w: 4, h: 3, holes: 3, upper: 1 },
          { w: 5, h: 3, holes: 3, upper: 1 },
          { w: 5, h: 4, holes: 4, upper: 1 },
          { w: 6, h: 3, holes: 4, upper: 1 },
          { w: 6, h: 2, holes: 4, upper: 0 }
        ];
      } else if (level <= 18) {
        patterns = [
          { w: 5, h: 3, holes: 4, upper: 1 },
          { w: 5, h: 4, holes: 4, upper: 2 },
          { w: 6, h: 3, holes: 4, upper: 1 },
          { w: 6, h: 4, holes: 5, upper: 2 },
          { w: 7, h: 3, holes: 5, upper: 1 }
        ];
      } else {
        patterns = [
          { w: 5, h: 4, holes: 5, upper: 2 },
          { w: 6, h: 4, holes: 5, upper: 2 },
          { w: 7, h: 3, holes: 5, upper: 1 },
          { w: 7, h: 4, holes: 6, upper: 2 }
        ];
      }

      const p = patterns[Math.floor(Math.random() * patterns.length)];
      const shape = Array.from({ length: p.h }, () => Array(p.w).fill(1));

      const bottomY = p.h - 1;

      // まず最下段に穴を作る。下から直接撃てる穴。
      const bottomHoleCount = Math.max(1, p.holes - p.upper);
      const bottomHoles = pickDistinctIntegers(p.w, bottomHoleCount);
      for (const hx of bottomHoles) {
        shape[bottomY][hx] = 0;
      }

      // 中段穴は、必ず同じ列の下側が空いている場合だけ作る。
      // これにより、下から順番に撃てば埋められる。
      if (p.upper > 0 && p.h >= 3) {
        const candidateCols = bottomHoles.slice();
        const upperHoleCount = Math.min(p.upper, candidateCols.length);
        for (let i = 0; i < upperHoleCount; i++) {
          const hx = candidateCols[i];
          const y = bottomY - 1;
          shape[y][hx] = 0;
        }
      }

      // 安全策：最下段が全部穴にならないようにする
      if (shape[bottomY].every(v => v === 0)) {
        shape[bottomY][0] = 1;
      }

      return shape;
    }

    function pickDistinctIntegers(max, count) {
      const values = [];
      const candidates = Array.from({ length: max }, (_, i) => i);

      while (values.length < count && candidates.length > 0) {
        const idx = Math.floor(Math.random() * candidates.length);
        values.push(candidates.splice(idx, 1)[0]);
      }

      return values;
    }

    function canPlaceShape(shape, startX, startY) {
      for (let sy = 0; sy < shape.length; sy++) {
        for (let sx = 0; sx < shape[sy].length; sx++) {
          if (shape[sy][sx] === 1) {
            const gx = startX + sx;
            const gy = startY + sy;
            if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
            if (grid[gy][gx] !== EMPTY) return false;
          }
        }
      }
      return true;
    }

    function placeShape(shape, startX, startY, groupId) {
      for (let sy = 0; sy < shape.length; sy++) {
        for (let sx = 0; sx < shape[sy].length; sx++) {
          if (shape[sy][sx] === 1) {
            grid[startY + sy][startX + sx] = groupId;
          }
        }
      }
    }

    function moveBlocksDownAsWhole() {
      // v6修正：
      // 以前はROWS-2にブロックがあるだけでゲームオーバーになり得た。
      // 画面上では危険ライン未到達に見えるため、これは理不尽。
      // まず1段下げ、その結果DANGER_ROWに到達した場合のみゲームオーバーにする。

      for (let y = ROWS - 2; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          grid[y + 1][x] = grid[y][x];
        }
      }

      for (let x = 0; x < COLS; x++) {
        grid[0][x] = EMPTY;
      }

      for (let x = 0; x < COLS; x++) {
        if (grid[DANGER_ROW][x] !== EMPTY) {
          triggerGameOver();
          return;
        }
      }
    }

    function movePlayer(dx) {
      if (!running || paused || gameEnded) return;
      const nextX = player.x + dx;
      if (nextX >= 0 && nextX < COLS) {
        player.x = nextX;
      }
    }

    function maxBulletsForLevel() {
      if (level <= 4) return 4;
      if (level <= 12) return 5;
      return 6;
    }

    function shoot() {
      if (!running || paused || gameEnded) return;
      if (bullets.length >= maxBulletsForLevel()) return;

      const startY = player.y - 1;
      if (startY < 0) return;

      if (grid[startY][player.x] !== EMPTY) {
        triggerGameOver();
        return;
      }

      bullets.push({ x: player.x, y: startY });
      playTone(540, 0.04, "square", 0.035);
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const nextY = b.y - 1;

        if (nextY < 0) {
          bullets.splice(i, 1);
          continue;
        }

        if (grid[nextY][b.x] !== EMPTY) {
          const targetGroupId = grid[nextY][b.x];
          attachBulletToGroup(b, i, targetGroupId);
          continue;
        }

        b.y = nextY;
      }
    }

    function attachBulletToGroup(bullet, index, targetGroupId) {
      if (bullet.y >= 0 && bullet.y < ROWS && grid[bullet.y][bullet.x] === EMPTY) {
        grid[bullet.y][bullet.x] = targetGroupId;
      }

      bullets.splice(index, 1);
      playTone(220, 0.05, "triangle", 0.04);
      checkRectangleForGroup(targetGroupId);
    }

    function checkRectangleForGroup(groupId) {
      const cells = getCellsByGroupId(groupId);
      if (cells.length === 0) return;

      if (isPerfectRectangle(cells)) {
        clearGroup(groupId, cells);
      }
    }

    function getCellsByGroupId(groupId) {
      const cells = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x] === groupId) {
            cells.push({ x, y });
          }
        }
      }
      return cells;
    }

    function isPerfectRectangle(cells) {
      if (cells.length < 2) return false;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const cell of cells) {
        minX = Math.min(minX, cell.x);
        maxX = Math.max(maxX, cell.x);
        minY = Math.min(minY, cell.y);
        maxY = Math.max(maxY, cell.y);
      }

      const width = maxX - minX + 1;
      const height = maxY - minY + 1;
      const area = width * height;

      if (area < 2) return false;
      if (cells.length !== area) return false;

      // 念のため、外接長方形内がすべて同じgroupIdか確認
      const id = grid[cells[0].y][cells[0].x];
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if (grid[y][x] !== id) return false;
        }
      }

      return true;
    }

    function clearGroup(groupId, cells) {
      for (const cell of cells) {
        grid[cell.y][cell.x] = EMPTY;
      }

      const area = cells.length;
      const gained = area * 10 + getAreaBonus(area);
      score += gained;
      scoreEl.textContent = score;

      clearFlashTimer = 150;
      gameWrap.classList.remove("flash");
      void gameWrap.offsetWidth;
      gameWrap.classList.add("flash");

      playClearSound();
    }

    function getAreaBonus(area) {
      if (area >= 24) return 1600;
      if (area >= 18) return 1000;
      if (area >= 12) return 600;
      if (area >= 8) return 250;
      if (area >= 6) return 120;
      if (area >= 4) return 50;
      return 0;
    }

    function checkLevelUp() {
      const newLevel = Math.floor(score / 2200) + 1;
      if (newLevel > level) {
        level = newLevel;
        levelEl.textContent = level;
        playTone(780, 0.08, "sawtooth", 0.04);
        setTimeout(() => playTone(980, 0.08, "sawtooth", 0.04), 80);
      }
    }

    function checkGameOver() {
      for (let x = 0; x < COLS; x++) {
        if (grid[DANGER_ROW][x] !== EMPTY) {
          triggerGameOver();
          return;
        }
      }
    }

    function triggerGameOver() {
      if (gameEnded) return;
      gameEnded = true;
      running = false;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(BEST_KEY, String(bestScore));
      }

      finalScoreEl.textContent = score;
      finalBestEl.textContent = bestScore;
      bestEl.textContent = bestScore;
      gameOverOverlay.classList.add("show");
      playGameOverSound();
    }

    function togglePause() {
      if (!running || gameEnded) return;
      paused = !paused;
      pauseOverlay.classList.toggle("show", paused);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("soundBtn").textContent = soundEnabled ? "SOUND ON" : "SOUND OFF";
    }

    function ensureAudio() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = "sine", volume = 0.03) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;

      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.start(now);
      osc.stop(now + duration);
    }

    function playClearSound() {
      playTone(660, 0.05, "square", 0.04);
      setTimeout(() => playTone(880, 0.06, "square", 0.035), 55);
    }

    function playGameOverSound() {
      playTone(260, 0.12, "sawtooth", 0.035);
      setTimeout(() => playTone(180, 0.18, "sawtooth", 0.03), 120);
    }

    initGame();
  </script>
</body>
